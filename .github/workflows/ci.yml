name: Continuous Integration

on:
  pull_request:  # Aciona para pull requests
  push:          # Aciona para pushs
    branches:
      - '*'  # Aciona em qualquer branch

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Diagnóstico - Verificar arquivos de feature
        run: |
          echo "=== Conteúdo do ExemploContexto.feature ==="
          cat src/main/resources/features/ExemploContexto.feature
          echo ""
          echo "=== Conteúdo do CadastroEntregas.feature ==="
          cat src/main/resources/features/CadastroEntregas.feature

      - name: Subir Microsserviço de Entregas (API)
        run: |
          git clone https://github.com/proflealvjo/ON_TDS_JAVA_ADVANCED_MICROSSERVICES_ENTREGAS.git
          nohup java -jar ON_TDS_JAVA_ADVANCED_MICROSSERVICES_ENTREGAS/entregas-0.0.1-SNAPSHOT.jar > api.log 2>&1 &
          echo "Aguardando inicialização da API..."
          for i in {1..40}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/entregas 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "API de entregas iniciada com sucesso! (HTTP $HTTP_CODE)"
              break
            fi
            echo "Tentativa $i/40 - HTTP: $HTTP_CODE. Aguardando..."
            sleep 3
          done
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/entregas 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Erro: A API não respondeu a tempo. Último HTTP: $HTTP_CODE. Logs da aplicação:"
            cat api.log
            exit 1
          fi

      - name: Build and test
        run: mvn clean test # Executa a suíte de testes Cucumber com RestAssured

  deploy:
    runs-on: ubuntu-latest
    needs: continuous-integration  # Esse job depende do anterior

    if: success()  # Executado apenas se os testes forem bem-sucedidos

    steps:
      - name: Deploy application
        run: |
          echo "Deploying application..."
          echo "✅ Deploy simulado concluído com sucesso!"